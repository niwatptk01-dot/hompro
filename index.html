<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Record - Premium System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

    <!-- Recharts (Stable CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.3/Recharts.min.js"></script>

    <!-- Font: Sarabun & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .font-num { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); scale: 0.98; } to { opacity: 1; transform: translateY(0); scale: 1; } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        slate: { 850: '#1e293b' }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 15px rgba(59, 130, 246, 0.15)'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-800 antialiased selection:bg-primary-100 selection:text-primary-700">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // --- Safe Recharts Access ---
        const RechartsObj = window.Recharts || {};
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = RechartsObj;

        // --- Safe Storage & Helpers ---
        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { console.warn('Storage Error'); } },
            keys: () => { try { return Object.keys(localStorage); } catch (e) { return []; } }
        };

        const formatNumber = (num) => {
            if (num === null || num === undefined || isNaN(num) || num === '') return "0";
            try {
                return Number(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            } catch (e) { return "0"; }
        };

        const dateToISO = (dateStr) => {
            if (!dateStr || typeof dateStr !== 'string') return '';
            // If already ISO, return as is
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
            try {
                const parts = dateStr.split('/');
                if (parts.length !== 3) return '';
                let year = parseInt(parts[2]);
                if (isNaN(year)) return '';
                if (year < 100) year += 2000; 
                return `${year}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            } catch (e) { return ''; }
        };

        const isoToDisplayDate = (isoDate) => {
            if (!isoDate) return '';
            try {
                const [year, month, day] = isoDate.split('-');
                return `${day}/${month}/${year.slice(2)}`;
            } catch (e) { return ''; }
        };

        const generateDateRangeString = (startIso, endIso) => {
            if (!startIso || !endIso) return '';
            try {
                const [sYear, sMonth, sDay] = startIso.split('-');
                const [eYear, eMonth, eDay] = endIso.split('-');
                if (sYear === eYear && sMonth === eMonth) {
                    return `${sDay}-${eDay}/${eMonth}/${eYear.slice(2)}`;
                }
                return `${sDay}/${sMonth}/${sYear.slice(2)} - ${eDay}/${eMonth}/${eYear.slice(2)}`;
            } catch (e) { return ''; }
        };

        const getThaiMonth = (dateStr) => {
            if (!dateStr || typeof dateStr !== 'string') return '';
            try {
                const parts = dateStr.split('/');
                if (parts.length !== 3) return '';
                const monthIndex = parseInt(parts[1], 10) - 1;
                const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
                return months[monthIndex] || '';
            } catch (e) { return ''; }
        };

        // --- Core Logic ---
        const calculateMonthlyTotals = (targetDateStr) => {
            const targetIso = dateToISO(targetDateStr);
            if (!targetIso) return null;
            const [year, month, day] = targetIso.split('-');
            const targetDayNum = parseInt(day);
            
            const totals = { dailySales: 0, appB2B: 0, bizId: 0, inactiveCalls: { called: 0, returned: 0, sales: 0 }, visits: { entry: 0, closed: 0, sales: 0 } };
            
            for (let d = 1; d < targetDayNum; d++) {
                const dayStr = String(d).padStart(2, '0');
                const checkDateStr = `${dayStr}/${month}/${year.slice(2)}`;
                const savedJson = safeStorage.getItem(`sales_data_${checkDateStr}`);
                if (savedJson) {
                    try {
                        const data = JSON.parse(savedJson);
                        totals.dailySales += Number(data.dailySales?.current || 0);
                        totals.appB2B += Number(data.appB2B?.current || 0);
                        totals.bizId += Number(data.bizId?.current || 0);
                        if (data.inactiveCalls) {
                            totals.inactiveCalls.called += Number(data.inactiveCalls.called?.current || 0);
                            totals.inactiveCalls.returned += Number(data.inactiveCalls.returned?.current || 0);
                            totals.inactiveCalls.sales += Number(data.inactiveCalls.sales?.current || 0);
                        }
                        if (data.visits) {
                            totals.visits.entry += Number(data.visits.entry?.current || 0);
                            totals.visits.closed += Number(data.visits.closed?.current || 0);
                            totals.visits.sales += Number(data.visits.sales?.current || 0);
                        }
                    } catch (e) {}
                }
            }
            return totals;
        };

        const aggregateDataByRange = (startDateStr, endDateStr) => {
            const startIso = dateToISO(startDateStr);
            const endIso = dateToISO(endDateStr);
            const summary = { dailySales: 0, appB2B: 0, bizId: 0, inactiveCalls: { called: 0, returned: 0, sales: 0 }, visits: { entry: 0, closed: 0, sales: 0 } };
            if (!startIso || !endIso) return summary;
            const keys = safeStorage.keys();
            keys.forEach(key => {
                if (key.startsWith("sales_data_")) {
                    const dateStr = key.replace("sales_data_", "");
                    const recordIso = dateToISO(dateStr);
                    if (recordIso >= startIso && recordIso <= endIso) {
                        try {
                            const data = JSON.parse(safeStorage.getItem(key));
                            summary.dailySales += Number(data.dailySales?.current || 0);
                            summary.appB2B += Number(data.appB2B?.current || 0);
                            summary.bizId += Number(data.bizId?.current || 0);
                            if (data.inactiveCalls) {
                                summary.inactiveCalls.called += Number(data.inactiveCalls.called?.current || 0);
                                summary.inactiveCalls.returned += Number(data.inactiveCalls.returned?.current || 0);
                                summary.inactiveCalls.sales += Number(data.inactiveCalls.sales?.current || 0);
                            }
                            if (data.visits) {
                                summary.visits.entry += Number(data.visits.entry?.current || 0);
                                summary.visits.closed += Number(data.visits.closed?.current || 0);
                                summary.visits.sales += Number(data.visits.sales?.current || 0);
                            }
                        } catch(e) {}
                    }
                }
            });
            return summary;
        };

        const getMonthlyDataSeries = (currentDateStr) => {
            const iso = dateToISO(currentDateStr);
            if(!iso) return [];
            const [year, month] = iso.split('-');
            const daysInMonth = new Date(year, month, 0).getDate();
            const series = [];
            for(let d = 1; d <= daysInMonth; d++) {
                const dayStr = String(d).padStart(2, '0');
                const checkDateStr = `${dayStr}/${month}/${year.slice(2)}`;
                const savedJson = safeStorage.getItem(`sales_data_${checkDateStr}`);
                let dayData = { day: d, totalSales: 0, appB2B: 0, inactive: 0, visits: 0 };
                if(savedJson) {
                    try {
                        const parsed = JSON.parse(savedJson);
                        dayData.totalSales = Number(parsed.dailySales?.current || 0);
                        dayData.appB2B = Number(parsed.appB2B?.current || 0);
                        dayData.inactive = Number(parsed.inactiveCalls?.sales?.current || 0);
                        dayData.visits = Number(parsed.visits?.sales?.current || 0);
                    } catch(e) {}
                }
                series.push(dayData);
            }
            return series;
        };

        const generateReportText = (data) => {
            if (!data) return "ไม่พบข้อมูล";
            try {
                const monthName = getThaiMonth(data.date);
                return `ยอดขายประจำเดือน ${monthName}\nวันที่ ${data.date} = ${formatNumber(data.dailySales?.current)}\nวันที่ ${data.monthRange} = ${formatNumber(data.dailySales?.accumulated)}\n\nยอดขาย APP B2B\nวันที่ ${data.date} = ${formatNumber(data.appB2B?.current)} บาท\nวันที่ ${data.monthRange} = ${formatNumber(data.appB2B?.accumulated)} บาท\n\nยอดสมัคร BizID\nวันที่ ${data.date} = ${formatNumber(data.bizId?.current)} ราย\nวันที่ ${data.monthRange} = ${formatNumber(data.bizId?.accumulated)} ราย\n\nยอดการโทรติดตามลูกค้า In Active\nโทรแล้ว ${formatNumber(data.inactiveCalls?.called?.total)} ราย\nเข้ามาแล้ว ${formatNumber(data.inactiveCalls?.returned?.total)} ราย\nยอดขาย ${formatNumber(data.inactiveCalls?.sales?.total)} บาท\n\nเข้าพบลูกค้า\nวันที่ ${data.date} = ${formatNumber(data.visits?.entry?.current)} ราย\nวันที่ ${data.monthRange} = ${formatNumber(data.visits?.entry?.total)} ราย\nเข้ามาปิดแล้ว ${formatNumber(data.visits?.closed?.total)} ราย\nยอดขาย ${formatNumber(data.visits?.sales?.total)} บาท`;
            } catch(e){ return "เกิดข้อผิดพลาดในการสร้างรายงาน"; }
        };

        // --- Icons ---
        const Icon = ({ children }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
        const TrendingUp = () => <Icon><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></Icon>;
        const Smartphone = () => <Icon><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></Icon>;
        const UserPlus = () => <Icon><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></Icon>;
        const Phone = () => <Icon><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></Icon>;
        const Users = () => <Icon><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></Icon>;
        const Clipboard = () => <Icon><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></Icon>;
        const Edit3 = () => <Icon><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></Icon>;
        const BarChartIcon = () => <Icon><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></Icon>;
        const ChartIcon = () => <Icon><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></Icon>;
        const Save = () => <Icon><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></Icon>;
        const Copy = () => <Icon><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></Icon>;
        const CheckCircle = () => <Icon><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></Icon>;
        const Calendar = () => <Icon><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></Icon>;
        const Calculator = () => <Icon><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></Icon>;
        const RefreshCw = () => <Icon><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></Icon>;
        const Lock = () => <Icon><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></Icon>;
        const Download = () => <Icon><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></Icon>;
        const Upload = () => <Icon><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>;
        const Filter = () => <Icon><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></Icon>;
        const PieChartIcon = () => <Icon><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></Icon>;

        // --- Sub-Components ---
        const StatCard = ({ title, icon: IconComp, children, colorClass = "bg-white" }) => (
            <div className={`p-6 rounded-2xl border border-slate-100 shadow-soft hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 ${colorClass}`}>
                <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-50/50">
                    <div className="p-3 bg-white rounded-xl shadow-sm ring-1 ring-slate-100 text-primary-600">
                        <IconComp />
                    </div>
                    <h3 className="font-bold text-slate-700 text-lg tracking-tight">{title}</h3>
                </div>
                {children}
            </div>
        );

        const AutoCalcGroup = ({ title, dataObj, onChange, suffix, labelToday = "วันนี้", labelPrevious = "ยอดยกมา" }) => {
            const safeData = dataObj || { previous: 0, current: 0, accumulated: 0, total: 0 };
            const total = safeData.accumulated ?? safeData.total ?? 0;
            return (
                <div className="bg-white p-5 rounded-2xl border border-slate-100 mb-6 shadow-sm hover:shadow-md transition-all duration-300">
                    <h4 className="text-sm font-bold text-slate-700 mb-4 flex justify-between items-center">
                        <span className="flex items-center gap-2 text-primary-700"><div className="p-1.5 bg-primary-50 rounded-lg"><Calculator /></div>{title}</span>
                        <span className="text-[10px] font-medium bg-emerald-50 text-emerald-600 px-2 py-1 rounded-md border border-emerald-100 flex items-center gap-1"><RefreshCw /> คำนวณอัตโนมัติ (M-T-D)</span>
                    </h4>
                    <div className="flex items-end gap-3 mb-4">
                        <div className="flex-1 bg-slate-50 rounded-xl p-3 border border-slate-100 relative group">
                            <div className="flex items-center gap-1.5 text-slate-400 mb-1"><span className="text-[10px] font-semibold uppercase tracking-wider">{labelPrevious}</span><div className="w-3 h-3"><Lock /></div></div>
                            <div className="font-num font-bold text-lg text-slate-600 truncate">{formatNumber(safeData.previous)}</div>
                        </div>
                        <div className="text-slate-300 pb-4"><span className="text-xl font-light">+</span></div>
                        <div className="flex-1 relative">
                            <label className="block text-[10px] font-semibold uppercase tracking-wider text-primary-600 mb-1.5 ml-1">{labelToday}</label>
                            <input type="number" value={safeData.current || ''} onChange={(e) => onChange('current', e.target.value)} onFocus={(e) => e.target.select()} className="w-full px-4 py-3 text-lg font-bold border-2 border-slate-100 bg-white text-slate-800 rounded-xl focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 outline-none font-num transition-all text-center shadow-sm" placeholder="0" />
                        </div>
                    </div>
                    <div className="flex items-center justify-between bg-slate-850 px-5 py-3 rounded-xl shadow-lg shadow-slate-200"><span className="text-xs font-medium text-slate-400">รวมสะสม</span><span className="font-bold text-xl text-white font-num tracking-wide">{formatNumber(total)} <span className="text-xs font-normal text-slate-500 ml-1">{suffix}</span></span></div>
                </div>
            );
        };

        const DashboardView = ({ data, onExport, onImport }) => {
            // Fix: Init state with proper display format for input
            const [filterStart, setFilterStart] = useState(isoToDisplayDate(data.rangeStartDate));
            const [filterEnd, setFilterEnd] = useState(isoToDisplayDate(data.rangeEndDate));
            const [summary, setSummary] = useState(null);

            useEffect(() => { const result = aggregateDataByRange(filterStart, filterEnd); setSummary(result); }, [filterStart, filterEnd]);
            const displayData = summary || { dailySales: 0, appB2B: 0, bizId: 0, inactiveCalls: { called: 0, returned: 0, sales: 0 }, visits: { entry: 0, closed: 0, sales: 0 } };
            // Fix: displayRangeText uses isoToDisplayDate wrapper for generateDateRangeString isn't needed if input is already text
            // But generateDateRangeString takes ISO. filterStart is Display.
            // So convert Display -> ISO for logic
            const displayRangeText = generateDateRangeString(dateToISO(filterStart), dateToISO(filterEnd));

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 animate-fade-in relative">
                    <div className="col-span-full flex flex-col md:flex-row justify-between items-center gap-4 mb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div className="flex items-center gap-3 w-full md:w-auto">
                            <div className="bg-primary-50 p-2 rounded-lg text-primary-600"><div className="w-5 h-5"><Filter /></div></div>
                            <div className="flex items-center gap-2 flex-1">
                                <input type="date" value={dateToISO(filterStart)} onChange={(e) => setFilterStart(isoToDisplayDate(e.target.value))} className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary-100 font-num" />
                                <span className="text-slate-400">-</span>
                                <input type="date" value={dateToISO(filterEnd)} onChange={(e) => setFilterEnd(isoToDisplayDate(e.target.value))} className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-primary-100 font-num" />
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onExport} className="flex items-center gap-2 px-3 py-2 bg-slate-50 text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-100 transition-colors"><div className="w-4 h-4"><Download /></div> Backup</button>
                            <label className="flex items-center gap-2 px-3 py-2 bg-slate-50 text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-100 transition-colors cursor-pointer"><div className="w-4 h-4"><Upload /></div> Restore <input type="file" accept=".json" onChange={onImport} className="hidden" /></label>
                        </div>
                    </div>
                    <StatCard title="ยอดขายรวม" icon={TrendingUp} colorClass="bg-white"><div className="space-y-6"><div><p className="text-sm font-medium text-slate-500 mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-primary-500"></span> ช่วงวันที่ {displayRangeText}</p><p className="text-4xl font-bold text-slate-800 font-num tracking-tight">฿{formatNumber(displayData.dailySales)}</p></div></div></StatCard>
                    <StatCard title="ยอดขาย APP B2B" icon={Smartphone} colorClass="bg-gradient-to-b from-white to-slate-50/30"><div className="space-y-6"><div><p className="text-sm font-medium text-slate-500 mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-indigo-500"></span> ช่วงวันที่ {displayRangeText}</p><p className="text-4xl font-bold text-indigo-600 font-num tracking-tight">฿{formatNumber(displayData.appB2B)}</p></div></div></StatCard>

                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                            <div className="mb-4"><label className="block text-sm font-semibold text-slate-700 mb-2">วันที่ปัจจุบัน</label><div className="relative group"><input type="date" value={dateToISO(data.date)} onChange={(e) => handleDateChange('date', isoToDisplayDate(e.target.value))} className="w-full pl-12 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all cursor-pointer font-num text-slate-700 shadow-sm" /><div className="absolute left-4 top-3 pointer-events-none text-slate-400 group-hover:text-primary-500 transition-colors"><div className="w-5 h-5"><Calendar /></div></div></div><p className="text-xs text-slate-500 mt-2 flex items-center gap-1.5"><span className="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> ระบบคำนวณยอดยกมาให้อัตโนมัติ (1 - {data.date.split('/')[0]})</p></div>
                        </div>

                    <div className="space-y-6"><div className="flex items-center gap-2 mb-2"><span className="w-1 h-6 bg-indigo-500 rounded-full"></span><h3 className="font-bold text-slate-700 text-lg">ยอดขาย APP B2B</h3></div><AutoCalcGroup title="คำนวณยอดขาย B2B" dataObj={data.appB2B} onChange={(type, val) => handleAutoCalc('appB2B', null, type, val)} suffix="บาท" /></div>
                    <div className="space-y-6"><div className="flex items-center gap-2 mb-2"><span className="w-1 h-6 bg-emerald-500 rounded-full"></span><h3 className="font-bold text-slate-700 text-lg">BizID</h3></div><AutoCalcGroup title="คำนวณยอดสมัคร" dataObj={data.bizId} onChange={(type, val) => handleAutoCalc('bizId', null, type, val)} suffix="ราย" labelToday="สมัครวันนี้" labelPrevious="ยอดสมัครยกมา" /></div>
                    <div className="space-y-6"><div className="flex items-center gap-2 mb-2"><span className="w-1 h-6 bg-slate-500 rounded-full"></span><h3 className="font-bold text-slate-700 text-lg">โทรติดตาม In Active</h3></div><AutoCalcGroup title="จำนวนการโทร" dataObj={data.inactiveCalls?.called} onChange={(type, val) => handleAutoCalc('inactiveCalls', 'called', type, val)} suffix="ราย" labelToday="โทรวันนี้" /><AutoCalcGroup title="ติดต่อได้/กลับมา" dataObj={data.inactiveCalls?.returned} onChange={(type, val) => handleAutoCalc('inactiveCalls', 'returned', type, val)} suffix="ราย" labelToday="เข้ามาวันนี้" /><AutoCalcGroup title="ยอดขายที่ได้" dataObj={data.inactiveCalls?.sales} onChange={(type, val) => handleAutoCalc('inactiveCalls', 'sales', type, val)} suffix="บาท" labelToday="ยอดขายวันนี้" /></div>
                    <div className="space-y-6"><div className="flex items-center gap-2 mb-2"><span className="w-1 h-6 bg-orange-500 rounded-full"></span><h3 className="font-bold text-slate-700 text-lg">เข้าพบลูกค้า</h3></div><AutoCalcGroup title="การเข้าพบ" dataObj={data.visits?.entry} onChange={(type, val) => handleAutoCalc('visits', 'entry', type, val)} suffix="ราย" labelToday="เข้าพบวันนี้" /><AutoCalcGroup title="ปิดการขายได้" dataObj={data.visits?.closed} onChange={(type, val) => handleAutoCalc('visits', 'closed', type, val)} suffix="ราย" labelToday="ปิดได้วันนี้" /><AutoCalcGroup title="ยอดขายจากการเข้าพบ" dataObj={data.visits?.sales} onChange={(type, val) => handleAutoCalc('visits', 'sales', type, val)} suffix="บาท" labelToday="ยอดขายวันนี้" /></div>
                </div>
                <div className="mt-12 flex justify-end pt-6 border-t border-slate-100"><button onClick={() => setActiveTab('dashboard')} className="flex items-center gap-2 bg-gradient-to-r from-primary-600 to-primary-500 text-white px-8 py-3 rounded-xl hover:shadow-lg hover:shadow-primary-500/30 transition-all duration-300 font-bold transform hover:-translate-y-0.5 active:translate-y-0"><div className="w-5 h-5"><Save /></div> บันทึกและดูผล</button></div>
            </div>
        );

        const ReportView = ({ data, copied, copyToClipboard }) => {
            const generateText = () => {
                try {
                    const monthName = getThaiMonth(data.date);
                    return `ยอดขายประจำเดือน ${monthName}\nวันที่ ${data.date} = ${formatNumber(data.dailySales?.current)}\nวันที่ ${data.monthRange} = ${formatNumber(data.dailySales?.accumulated)}\n\nยอดขาย APP B2B\nวันที่ ${data.date} = ${formatNumber(data.appB2B?.current)} บาท\nวันที่ ${data.monthRange} = ${formatNumber(data.appB2B?.accumulated)} บาท\n\nยอดสมัคร BizID\nวันที่ ${data.date} = ${formatNumber(data.bizId?.current)} ราย\nวันที่ ${data.monthRange} = ${formatNumber(data.bizId?.accumulated)} ราย\n\nยอดการโทรติดตามลูกค้า In Active\nโทรแล้ว ${formatNumber(data.inactiveCalls?.called?.total)} ราย\nเข้ามาแล้ว ${formatNumber(data.inactiveCalls?.returned?.total)} ราย\nยอดขาย ${formatNumber(data.inactiveCalls?.sales?.total)} บาท\n\nเข้าพบลูกค้า\nวันที่ ${data.date} = ${formatNumber(data.visits?.entry?.current)} ราย\nวันที่ ${data.monthRange} = ${formatNumber(data.visits?.entry?.total)} ราย\nเข้ามาปิดแล้ว ${formatNumber(data.visits?.closed?.total)} ราย\nยอดขาย ${formatNumber(data.visits?.sales?.total)} บาท`;
                } catch(e){ return "Error"; }
            };
            return (
                <div className="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 max-w-2xl mx-auto animate-fade-in"><div className="flex justify-between items-center mb-6"><div><h3 className="text-xl font-bold text-slate-800">รูปแบบข้อความรายงาน</h3><p className="text-sm text-slate-500">พร้อมสำหรับคัดลอกและส่งต่อ</p></div><button onClick={copyToClipboard} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl transition-all duration-300 font-bold shadow-sm ${copied ? 'bg-emerald-100 text-emerald-700 ring-1 ring-emerald-200' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 ring-1 ring-slate-200'}`}>{copied ? <div className="w-5 h-5"><CheckCircle /></div> : <div className="w-5 h-5"><Copy /></div>}{copied ? 'คัดลอกแล้ว!' : 'คัดลอกข้อความ'}</button></div><div className="relative"><div className="absolute inset-0 bg-slate-50 rounded-2xl border border-slate-200 transform translate-x-2 translate-y-2 -z-10"></div><div className="bg-slate-850 p-6 rounded-2xl border border-slate-700 font-num text-sm text-slate-300 whitespace-pre-wrap leading-relaxed shadow-inner overflow-x-auto">{generateText()}</div></div></div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [copied, setCopied] = useState(false);
            
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const yearFull = now.getFullYear();
            const yearShort = String(yearFull).slice(-2);
            const currentDisplayDate = `${day}/${month}/${yearShort}`;
            const currentIsoDate = `${yearFull}-${month}-${day}`;
            const currentMonthStartIso = `${yearFull}-${month}-01`;
            const currentRangeString = generateDateRangeString(currentMonthStartIso, currentIsoDate);

            const initialData = { date: currentDisplayDate, rangeStartDate: currentMonthStartIso, rangeEndDate: currentIsoDate, monthRange: currentRangeString, dailySales: { current: 0, previous: 0, accumulated: 0 }, appB2B: { current: 0, previous: 0, accumulated: 0 }, bizId: { current: 0, previous: 0, accumulated: 0 }, inactiveCalls: { called: { current: 0, previous: 0, total: 0 }, returned: { current: 0, previous: 0, total: 0 }, sales: { current: 0, previous: 0, total: 0 } }, visits: { entry: { current: 0, previous: 0, total: 0 }, closed: { current: 0, previous: 0, total: 0 }, sales: { current: 0, previous: 0, total: 0 } } };
            const [data, setData] = useState(initialData);

            const mergeDataForDate = (baseData, dateStr) => {
                const prevTotals = calculateMonthlyTotals(dateStr);
                const savedJson = safeStorage.getItem(`sales_data_${dateStr}`);
                const savedData = savedJson ? JSON.parse(savedJson) : null;
                const newState = JSON.parse(JSON.stringify(baseData));
                newState.date = dateStr;
                
                const isoDate = dateToISO(dateStr);
                const [year, month] = isoDate.split('-');
                const startDate = `${year}-${month}-01`;
                newState.monthRange = generateDateRangeString(startDate, isoDate);
                newState.rangeStartDate = startDate;
                newState.rangeEndDate = isoDate;

                const setValues = (obj, prevVal, currVal) => {
                    obj.previous = prevVal || 0;
                    obj.current = currVal || 0;
                    obj.accumulated = obj.previous + obj.current;
                    if(obj.total !== undefined) obj.total = obj.accumulated;
                };

                setValues(newState.dailySales, prevTotals?.dailySales, savedData?.dailySales?.current);
                setValues(newState.appB2B, prevTotals?.appB2B, savedData?.appB2B?.current);
                setValues(newState.bizId, prevTotals?.bizId, savedData?.bizId?.current);
                setValues(newState.inactiveCalls.called, prevTotals?.inactiveCalls?.called, savedData?.inactiveCalls?.called?.current);
                setValues(newState.inactiveCalls.returned, prevTotals?.inactiveCalls?.returned, savedData?.inactiveCalls?.returned?.current);
                setValues(newState.inactiveCalls.sales, prevTotals?.inactiveCalls?.sales, savedData?.inactiveCalls?.sales?.current);
                setValues(newState.visits.entry, prevTotals?.visits?.entry, savedData?.visits?.entry?.current);
                setValues(newState.visits.closed, prevTotals?.visits?.closed, savedData?.visits?.closed?.current);
                setValues(newState.visits.sales, prevTotals?.visits?.sales, savedData?.visits?.sales?.current);
                return newState;
            };

            useEffect(() => { const newData = mergeDataForDate(initialData, initialData.date); setData(newData); }, []);
            useEffect(() => { const timer = setTimeout(() => { try { safeStorage.setItem(`sales_data_${data.date}`, JSON.stringify(data)); } catch(e) {} }, 500); return () => clearTimeout(timer); }, [data]);

            const handleInputChange = (section, field, value) => { setData(prev => ({ ...prev, [section]: { ...prev[section], [field]: value } })); };
            const handleDateChange = (field, value) => { if (field === 'date') { const newData = mergeDataForDate(initialData, value); setData(newData); } else { setData(prev => ({ ...prev, [field]: value })); } };
            const handleRangeChange = (type, value) => {}; 
            const handleAutoCalc = (section, subSection, type, value) => { let numValue = value === '' ? 0 : Number(value); if (isNaN(numValue)) numValue = 0; setData(prev => { let targetObj; let newState = JSON.parse(JSON.stringify(prev)); if (subSection) { targetObj = newState[section][subSection]; } else { targetObj = newState[section]; } targetObj[type] = numValue; const total = (targetObj.previous || 0) + (targetObj.current || 0); if (targetObj.hasOwnProperty('accumulated')) { targetObj.accumulated = total; } else { targetObj.total = total; } return newState; }); };
            
            const handleExport = () => { try { const allData = {}; safeStorage.keys().forEach(key => { if (key.startsWith("sales_data_")) { const value = safeStorage.getItem(key); if (value) allData[key] = JSON.parse(value); } }); const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData)); const downloadAnchorNode = document.createElement('a'); downloadAnchorNode.setAttribute("href", dataStr); const dateStr = new Date().toISOString().split('T')[0]; downloadAnchorNode.setAttribute("download", `sales_backup_${dateStr}.json`); document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove(); } catch (e) { alert("Error exporting"); } };
            const handleImport = (event) => { const fileReader = new FileReader(); if (!event.target.files[0]) return; fileReader.readAsText(event.target.files[0], "UTF-8"); fileReader.onload = (e) => { try { const importedData = JSON.parse(e.target.result); let count = 0; Object.keys(importedData).forEach(key => { if (key.startsWith("sales_data_")) { safeStorage.setItem(key, JSON.stringify(importedData[key])); count++; } }); alert(`Imported ${count} records.`); window.location.reload(); } catch (error) { alert("Invalid file"); } }; };
            const copyToClipboard = () => { const text = generateReportText(data); const textArea = document.createElement("textarea"); textArea.value = text; textArea.style.position = "fixed"; textArea.style.left = "-9999px"; textArea.style.top = "0"; document.body.appendChild(textArea); textArea.focus(); textArea.select(); try { if(document.execCommand('copy')) { setCopied(true); setTimeout(() => setCopied(false), 2000); } } catch (err) {} document.body.removeChild(textArea); };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 pb-20"><div className="bg-white/80 backdrop-blur-md shadow-soft border-b border-slate-100 sticky top-0 z-50"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div className="flex justify-between h-20 items-center"><div className="flex items-center gap-4"><div className="bg-gradient-to-br from-primary-600 to-primary-500 p-2.5 rounded-xl shadow-lg shadow-primary-500/30"><div className="w-6 h-6 text-white"><BarChartIcon /></div></div><div><h1 className="text-xl font-bold text-slate-800 tracking-tight">Daily Sales Record</h1><p className="text-xs text-slate-500 font-medium">ระบบบันทึกยอดขายประจำวัน</p></div></div><div className="hidden sm:flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-full border border-slate-100 shadow-sm"><div className="w-4 h-4 text-primary-500"><Calendar /></div><span className="text-sm text-slate-600 font-semibold font-num">{data.date}</span></div></div></div></div><main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"><div className="flex flex-wrap gap-2 mb-8 bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm w-fit mx-auto sm:mx-0"><button onClick={() => setActiveTab('dashboard')} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'dashboard' ? 'bg-primary-50 text-primary-700 shadow-sm ring-1 ring-primary-100' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><div className="w-4 h-4"><BarChartIcon /></div> Dashboard</button><button onClick={() => setActiveTab('analysis')} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'analysis' ? 'bg-primary-50 text-primary-700 shadow-sm ring-1 ring-primary-100' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><div className="w-4 h-4"><ChartIcon /></div> วิเคราะห์</button><button onClick={() => setActiveTab('edit')} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'edit' ? 'bg-primary-50 text-primary-700 shadow-sm ring-1 ring-primary-100' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><div className="w-4 h-4"><Edit3 /></div> กรอกข้อมูล</button><button onClick={() => setActiveTab('report')} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'report' ? 'bg-primary-50 text-primary-700 shadow-sm ring-1 ring-primary-100' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><div className="w-4 h-4"><Clipboard /></div> สรุปข้อความ</button></div><div className="min-h-[500px]">{activeTab === 'dashboard' && <DashboardView data={data} onExport={handleExport} onImport={handleImport} />}{activeTab === 'analysis' && <AnalysisView currentDate={data.date} />}{activeTab === 'edit' && <EditView data={data} handleInputChange={handleInputChange} handleAutoCalc={handleAutoCalc} handleDateChange={handleDateChange} handleRangeChange={handleRangeChange} setActiveTab={setActiveTab} />}{activeTab === 'report' && <ReportView data={data} copied={copied} copyToClipboard={copyToClipboard} />}</div></main></div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
